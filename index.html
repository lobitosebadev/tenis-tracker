<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tennis Coach Tracker</title>
  <style>
    :root {
      --bg: #0b1329;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green-bg: #064e3b;
      --green-border: #10b981;
      --green-text: #6ee7b7;
      --red-bg: #450a0a;
      --red-border: #ef4444;
      --red-text: #fca5a5;
      --blue: #2563eb;
      --purple: #7c3aed;
      --yellow: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; padding-bottom: 95px; }

    /* Pestañas */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .tab-btn { background: var(--card); color: var(--text-muted); border: 1px solid var(--border); padding: 12px; font-weight: 700; border-radius: 8px; font-size: 14px; }
    .tab-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

    .view { display: none; }
    .view.active { display: block; }

    /* Configuración Alumnos */
    .config-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
    .config-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; display: block; }
    .config-input { width: 100%; background: #070d1e; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; font-size: 13px; }

    /* Barra selección de alumno */
    .student-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
    .st-chip { background: var(--card); border: 2px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .st-chip.active { background: var(--purple); border-color: #a78bfa; color: white; }

    /* Secciones de botones */
    .group-label { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .grid-1 { display: grid; grid-template-columns: 1fr; margin-bottom: 12px; }

    .action-btn { border-radius: 10px; padding: 16px 8px; font-size: 15px; font-weight: 800; text-align: center; border: 1px solid transparent; cursor: pointer; }
    .action-btn:active { transform: scale(0.96); filter: brightness(1.3); }

    /* Variantes de color */
    .btn-winner { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }
    .btn-error { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }
    .btn-forced { background: #3f1d24; border-color: #f43f5e; color: #fda4af; }

    /* Canasto Saques */
    .serve-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .serve-header { grid-column: span 2; font-size: 15px; font-weight: 800; color: #38bdf8; }
    .serve-box { background: #070d1e; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
    .serve-count { font-size: 24px; font-weight: 900; margin: 4px 0; }
    .btn-serve-hit { width: 100%; background: #065f46; border: 1px solid var(--green-border); color: white; padding: 12px 0; border-radius: 6px; font-weight: 800; font-size: 14px; }
    .btn-serve-hit:active { background: var(--green-border); }

    /* Modal Zona Error */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .modal-backdrop.show { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 320px; padding: 18px; text-align: center; }
    .modal-box h3 { font-size: 16px; margin-bottom: 14px; }
    .zone-btn { width: 100%; background: #1e293b; border: 1px solid #475569; color: white; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 15px; margin-bottom: 8px; }
    .zone-btn:active { background: var(--red-border); }

    /* Barra inferior */
    .dock-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #030712; border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; z-index: 50; }
    .btn-dock { border: none; font-weight: 800; padding: 12px; border-radius: 8px; font-size: 13px; }
    .btn-export { flex: 2; background: #10b981; color: #022c22; }
    .btn-undo { flex: 1; background: var(--yellow); color: #451a03; }
    .btn-clear { flex: 1; background: #334155; color: white; }

    .status-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('puntos')">Puntos / Juego</button>
    <button class="tab-btn" onclick="switchTab('saques')">Canasto Saques</button>
  </div>

  <div class="config-card">
    <label class="config-label">Alumnos (separar con comas):</label>
    <input type="text" id="inputStudents" class="config-input" value="Pablo, Juan, Segundo" onchange="renderApp()">
  </div>

  <!-- VISTA PUNTOS -->
  <div id="tab-puntos" class="view active">
    <div class="group-label">Alumno Activo:</div>
    <div class="student-bar" id="studentBar"></div>

    <div class="group-label">Winners (Tiros Ganadores)</div>
    <div class="grid-2">
      <button class="action-btn btn-winner" onclick="recordPoint('Drive', 'Winner', '')">Drive W</button>
      <button class="action-btn btn-winner" onclick="recordPoint('Revés', 'Winner', '')">Revés W</button>
    </div>

    <div class="group-label">Juego de Red (Volea)</div>
    <div class="grid-2">
      <button class="action-btn btn-winner" onclick="recordPoint('Volea', 'Acierto', '')">Volea Adentro</button>
      <button class="action-btn btn-error" onclick="recordPoint('Volea', 'Error', '')">Volea Afuera</button>
    </div>

    <div class="group-label">Errores No Forzados (Fondo)</div>
    <div class="grid-2">
      <button class="action-btn btn-error" onclick="promptErrorZone('Drive')">Drive ENF</button>
      <button class="action-btn btn-error" onclick="promptErrorZone('Revés')">Revés ENF</button>
    </div>

    <div class="group-label">Defensa / Presión</div>
    <div class="grid-1">
      <button class="action-btn btn-forced" onclick="recordPoint('General', 'Error forzado', '')">Error Forzado</button>
    </div>

    <div class="status-text" id="statusPuntos">Registros totales: 0</div>
  </div>

  <!-- VISTA SAQUES -->
  <div id="tab-saques" class="view">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <div class="group-label" style="margin:0;">Aciertos por serie</div>
      <div style="font-size: 11px; color: var(--text-muted); font-weight:700;">
        Intentos por tanda: <input type="number" id="serveTargetInput" value="10" style="width:42px; background:#070d1e; border:1px solid var(--border); color:white; border-radius:4px; text-align:center; padding:2px;">
      </div>
    </div>
    <div id="servesList"></div>
  </div>

  <!-- MODAL ZONA ERROR -->
  <div class="modal-backdrop" id="zoneModal">
    <div class="modal-box">
      <h3 id="zoneModalTitle">¿Dónde falló?</h3>
      <button class="zone-btn" onclick="saveZone('Red')">RED</button>
      <button class="zone-btn" onclick="saveZone('Larga')">LARGA</button>
      <button class="zone-btn" onclick="saveZone('Ancha')">ANCHA</button>
    </div>
  </div>

  <!-- DOCK FIJO -->
  <div class="dock-bar">
    <button class="btn-dock btn-undo" onclick="undoLast()">Deshacer</button>
    <button class="btn-dock btn-clear" onclick="clearData()">Borrar</button>
    <button class="btn-dock btn-export" onclick="exportCSV()">Exportar CSV</button>
  </div>

  <script>
    let players = [];
    let activePlayer = "";
    let matchLogs = [];
    let basketServes = {};
    let activeStrokeForZone = "";

    function renderApp() {
      const raw = document.getElementById('inputStudents').value;
      players = raw.split(',').map(p => p.trim()).filter(p => p.length > 0);
      if (players.length > 0 && (!activePlayer || !players.includes(activePlayer))) {
        activePlayer = players[0];
      }

      // Chips alumnos
      const bar = document.getElementById('studentBar');
      bar.innerHTML = '';
      players.forEach(p => {
        const chip = document.createElement('button');
        chip.className = `st-chip ${p === activePlayer ? 'active' : ''}`;
        chip.innerText = p;
        chip.onclick = () => {
          activePlayer = p;
          document.querySelectorAll('.st-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        };
        bar.appendChild(chip);
      });

      // Tarjetas saque
      const list = document.getElementById('servesList');
      list.innerHTML = '';
      players.forEach(p => {
        if (!basketServes[p]) basketServes[p] = { s1: 0, s2: 0 };
        const card = document.createElement('div');
        card.className = 'serve-card';
        card.innerHTML = `
          <div class="serve-header">${p}</div>
          <div class="serve-box">
            <div style="font-size:11px; color:#94a3b8; font-weight:700;">1er Saque</div>
            <div class="serve-count" id="cnt1-${p}">${basketServes[p].s1}</div>
            <button class="btn-serve-hit" onclick="logServeHit('${p}', 1)">+ ACERTÓ</button>
          </div>
          <div class="serve-box">
            <div style="font-size:11px; color:#94a3b8; font-weight:700;">2do Saque</div>
            <div class="serve-count" id="cnt2-${p}">${basketServes[p].s2}</div>
            <button class="btn-serve-hit" onclick="logServeHit('${p}', 2)">+ ACERTÓ</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function switchTab(t) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      if (t === 'puntos') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('tab-puntos').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('tab-saques').classList.add('active');
      }
    }

    function todayStr() {
      const d = new Date();
      return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    }

    function recordPoint(golpe, res, zona) {
      matchLogs.push({
        Alumno: activePlayer,
        Fecha: todayStr(),
        Instancia: "Entrenamiento",
        Golpe: golpe,
        Resultado: res,
        ZonaFalla: zona
      });
      updateStatus();
    }

    function promptErrorZone(golpe) {
      activeStrokeForZone = golpe;
      document.getElementById('zoneModalTitle').innerText = `${golpe} ENF: ¿Dónde pegó?`;
      document.getElementById('zoneModal').classList.add('show');
    }

    function saveZone(zona) {
      recordPoint(activeStrokeForZone, "Error no forzado", zona);
      document.getElementById('zoneModal').classList.remove('show');
    }

    function logServeHit(player, type) {
      if (type === 1) {
        basketServes[player].s1++;
        document.getElementById(`cnt1-${player}`).innerText = basketServes[player].s1;
      } else {
        basketServes[player].s2++;
        document.getElementById(`cnt2-${player}`).innerText = basketServes[player].s2;
      }
    }

    function undoLast() {
      const isPoints = document.getElementById('tab-puntos').classList.contains('active');
      if (isPoints) {
        if (matchLogs.length === 0) return alert("No hay jugadas para deshacer.");
        const removed = matchLogs.pop();
        alert(`Se eliminó el último registro: ${removed.Alumno} - ${removed.Golpe} (${removed.Resultado})`);
        updateStatus();
      } else {
        alert("En saques podés reiniciar la serie con el botón Borrar.");
      }
    }

    function updateStatus() {
      const total = matchLogs.length;
      const playerTotal = matchLogs.filter(l => l.Alumno === activePlayer).length;
      document.getElementById('statusPuntos').innerText = `Total sesión: ${total} | De ${activePlayer}: ${playerTotal}`;
    }

    function exportCSV() {
      const isPoints = document.getElementById('tab-puntos').classList.contains('active');
      let csv = "\uFEFF"; // Previene fallos de tildes (Revés)

      if (isPoints) {
        if (matchLogs.length === 0) return alert("No hay jugadas registradas.");
        csv += "Alumno,Fecha,Instancia,Golpe,Resultado,Zona falla\r\n";
        matchLogs.forEach(r => {
          csv += `"${r.Alumno}","${r.Fecha}","${r.Instancia}","${r.Golpe}","${r.Resultado}","${r.ZonaFalla}"\r\n`;
        });
        triggerDownload(csv, `Partidos_${Date.now()}.csv`);
      } else {
        const attempts = document.getElementById('serveTargetInput').value || 10;
        csv += "Alumno,Fecha,Instancia,Golpe,Resultado,Total Intentos\r\n";
        players.forEach(p => {
          csv += `"${p}","${todayStr()}","Entrenamiento","1er Saque",${basketServes[p].s1},${attempts}\r\n`;
          csv += `"${p}","${todayStr()}","Entrenamiento","2do Saque",${basketServes[p].s2},${attempts}\r\n`;
        });
        triggerDownload(csv, `Canasto_Saque_${Date.now()}.csv`);
      }
    }

    function triggerDownload(content, filename) {
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function clearData() {
      if (!confirm("¿Deseas reiniciar los datos de la pestaña actual?")) return;
      if (document.getElementById('tab-puntos').classList.contains('active')) {
        matchLogs = [];
        updateStatus();
      } else {
        players.forEach(p => { basketServes[p] = { s1: 0, s2: 0 }; });
        renderApp();
      }
    }

    window.onload = renderApp;
  </script>
</body>
</html>
