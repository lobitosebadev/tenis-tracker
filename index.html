<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Planilla Tenis Coach</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --orange: #f59e0b;
      --purple: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; padding-bottom: 90px; }

    /* Navegación pestañas */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .tab-btn { background: var(--card); color: var(--text-dim); border: 1px solid var(--border); padding: 10px; font-weight: 600; border-radius: 8px; font-size: 14px; }
    .tab-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

    .view { display: none; }
    .view.active { display: block; }

    /* Configuración de Alumnas */
    .config-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
    .config-card label { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 5px; }
    .config-input { width: 100%; background: #0b1120; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; font-size: 13px; }

    /* Barra selección rápida de alumna activa (Puntos) */
    .students-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
    .st-btn { background: var(--card); border: 2px solid var(--border); color: var(--text-dim); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; white-space: nowrap; }
    .st-btn.active { background: var(--purple); border-color: #a78bfa; color: white; }

    /* Botonera de Juego */
    .section-title { font-size: 12px; font-weight: bold; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; }
    .grid-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .action-btn { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 6px; color: white; font-size: 13px; font-weight: 600; text-align: center; }
    .action-btn:active { transform: scale(0.97); }
    .btn-win { background: #064e3b; border-color: var(--green); color: #6ee7b7; }
    .btn-err { background: #450a0a; border-color: var(--red); color: #fca5a5; }

    /* Menú flotante de zona de error */
    .error-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .error-modal.show { display: flex; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 320px; padding: 16px; text-align: center; }
    .modal-content h3 { font-size: 15px; margin-bottom: 12px; }
    .zones-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .zone-btn { background: #262626; border: 1px solid #404040; color: white; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; }
    .zone-btn:active { background: var(--red); }

    /* Canasto Saque */
    .serve-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
    .serve-name { grid-column: span 2; font-size: 15px; font-weight: bold; color: #38bdf8; display: flex; justify-content: space-between; }
    .serve-box { background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
    .serve-box .count { font-size: 18px; font-weight: 800; margin: 4px 0; }
    .btn-serve-add { width: 100%; background: #065f46; border: 1px solid var(--green); color: white; padding: 8px 0; border-radius: 6px; font-weight: bold; font-size: 13px; }
    .btn-serve-add:active { background: var(--green); }

    /* Barra inferior fija */
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #020617; border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; z-index: 50; }
    .btn-exp { flex: 2; background: var(--green); color: black; border: none; font-weight: bold; padding: 12px; border-radius: 8px; font-size: 13px; }
    .btn-reset { flex: 1; background: #334155; color: white; border: none; font-weight: bold; padding: 12px; border-radius: 8px; font-size: 13px; }
  </style>
</head>
<body>

  <!-- Selector de Vistas -->
  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('puntos')">Puntos / Juego</button>
    <button class="tab-btn" onclick="setTab('saques')">Canasto Saque</button>
  </div>

  <!-- Configuración rápida de alumnas -->
  <div class="config-card">
    <label>Alumnas presentes (separadas por coma):</label>
    <input type="text" id="studentsInput" class="config-input" value="Martina, Sofia, Valentina, Camila" onchange="initApp()">
  </div>

  <!-- VISTA 1: PUNTOS / AMERICANA -->
  <div id="view-puntos" class="view active">
    <div class="section-title">Alumna activa para la jugada:</div>
    <div class="students-scroll" id="studentsContainer"></div>

    <div class="section-title">Tiros Ganadores (Winners)</div>
    <div class="grid-actions">
      <button class="action-btn btn-win" onclick="addPoint('Drive', 'Winner', '')">Drive W</button>
      <button class="action-btn btn-win" onclick="addPoint('Revés', 'Winner', '')">Revés W</button>
      <button class="action-btn btn-win" onclick="addPoint('Volea', 'Acierto', '')">Volea W</button>
    </div>

    <div class="section-title">Errores (Selecciona golpe para zona)</div>
    <div class="grid-actions">
      <button class="action-btn btn-err" onclick="openErrorModal('Drive')">Drive ENF</button>
      <button class="action-btn btn-err" onclick="openErrorModal('Revés')">Revés ENF</button>
      <button class="action-btn btn-err" onclick="addPoint('Volea', 'Error', '')">Volea Error</button>
      <button class="action-btn btn-err" style="grid-column: span 3; background:#7f1d1d;" onclick="addPoint('Drive', 'Error forzado', '')">Error Forzado</button>
    </div>

    <div style="font-size: 12px; color: var(--text-dim);" id="logStatusPuntos">Puntos anotados: 0</div>
  </div>

  <!-- VISTA 2: CANASTO SAQUE SIMULTÁNEO -->
  <div id="view-saques" class="view">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <div class="section-title">Series simultáneas</div>
      <div style="font-size: 11px; color: var(--text-dim);">
        Total tiros: <input type="number" id="serveTarget" value="10" style="width:40px; background:#0b1120; border:1px solid var(--border); color:white; border-radius:4px; text-align:center;">
      </div>
    </div>
    <div id="servesContainer"></div>
  </div>

  <!-- Modal de Zona de Error -->
  <div class="error-modal" id="errorModal">
    <div class="modal-content">
      <h3 id="modalTitle">¿Dónde falló?</h3>
      <div class="zones-grid">
        <button class="zone-btn" onclick="confirmError('Red')">RED</button>
        <button class="zone-btn" onclick="confirmError('Larga')">LARGA</button>
        <button class="zone-btn" onclick="confirmError('Ancha')">ANCHA</button>
      </div>
    </div>
  </div>

  <!-- Barra de exportación fija -->
  <div class="footer-bar">
    <button class="btn-reset" onclick="resetCurrentView()">Borrar</button>
    <button class="btn-exp" onclick="exportData()">Exportar CSV</button>
  </div>

  <script>
    let students = [];
    let activeStudent = "";
    let pointsLog = [];
    let servesData = {};
    let pendingStroke = "";

    function initApp() {
      const raw = document.getElementById('studentsInput').value;
      students = raw.split(',').map(s => s.trim()).filter(s => s.length > 0);
      if (students.length > 0) activeStudent = students[0];

      // Render barra alumnas
      const stContainer = document.getElementById('studentsContainer');
      stContainer.innerHTML = '';
      students.forEach(st => {
        const b = document.createElement('button');
        b.className = `st-btn ${st === activeStudent ? 'active' : ''}`;
        b.innerText = st;
        b.onclick = () => {
          activeStudent = st;
          document.querySelectorAll('.st-btn').forEach(btn => btn.classList.remove('active'));
          b.classList.add('active');
        };
        stContainer.appendChild(b);
      });

      // Render tarjetas de saque
      const srvContainer = document.getElementById('servesContainer');
      srvContainer.innerHTML = '';
      students.forEach(st => {
        if (!servesData[st]) servesData[st] = { in1: 0, in2: 0 };
        const card = document.createElement('div');
        card.className = 'serve-card';
        card.innerHTML = `
          <div class="serve-name"><span>${st}</span></div>
          <div class="serve-box">
            <div style="font-size:11px; color:#94a3b8;">1er Saque</div>
            <div class="count" id="s1-${st}">${servesData[st].in1}</div>
            <button class="btn-serve-add" onclick="addServe('${st}', 1)">+ ACERTO</button>
          </div>
          <div class="serve-box">
            <div style="font-size:11px; color:#94a3b8;">2do Saque</div>
            <div class="count" id="s2-${st}">${servesData[st].in2}</div>
            <button class="btn-serve-add" onclick="addServe('${st}', 2)">+ ACERTO</button>
          </div>
        `;
        srvContainer.appendChild(card);
      });
    }

    function setTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      if (tab === 'puntos') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('view-puntos').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('view-saques').classList.add('active');
      }
    }

    function getToday() {
      const d = new Date();
      return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    }

    /* Lógica Puntos */
    function addPoint(golpe, resultado, zona) {
      pointsLog.push({
        Alumno: activeStudent,
        Fecha: getToday(),
        Instancia: "Entrenamiento",
        Golpe: golpe,
        Resultado: resultado,
        ZonaFalla: zona
      });
      document.getElementById('logStatusPuntos').innerText = `Puntos anotados: ${pointsLog.length} (Último: ${activeStudent} - ${golpe})`;
    }

    function openErrorModal(golpe) {
      pendingStroke = golpe;
      document.getElementById('modalTitle').innerText = `${golpe}: ¿Dónde fue el fallo?`;
      document.getElementById('errorModal').classList.add('show');
    }

    function confirmError(zona) {
      addPoint(pendingStroke, "Error no forzado", zona);
      document.getElementById('errorModal').classList.remove('show');
    }

    /* Lógica Saques */
    function addServe(st, type) {
      if (type === 1) {
        servesData[st].in1++;
        document.getElementById(`s1-${st}`).innerText = servesData[st].in1;
      } else {
        servesData[st].in2++;
        document.getElementById(`s2-${st}`).innerText = servesData[st].in2;
      }
    }

    /* Exportación CSV Limpia */
    function exportData() {
      const isPointsActive = document.getElementById('view-puntos').classList.contains('active');
      let csv = "\uFEFF"; // BOM UTF-8 para evitar caracteres rotos en Excel

      if (isPointsActive) {
        if (pointsLog.length === 0) return alert("No hay jugadas anotadas.");
        csv += "Alumno,Fecha,Instancia,Golpe,Resultado,Zona falla\r\n";
        pointsLog.forEach(r => {
          csv += `"${r.Alumno}","${r.Fecha}","${r.Instancia}","${r.Golpe}","${r.Resultado}","${r.ZonaFalla}"\r\n`;
        });
        downloadFile(csv, `Puntos_Grupal_${Date.now()}.csv`);
      } else {
        const totalAttempts = document.getElementById('serveTarget').value || 10;
        csv += "Alumno,Fecha,Instancia,Golpe,Resultado,Total Intentos\r\n";
        students.forEach(st => {
          csv += `"${st}","${getToday()}","Entrenamiento","1er Saque",${servesData[st].in1},${totalAttempts}\r\n`;
          csv += `"${st}","${getToday()}","Entrenamiento","2do Saque",${servesData[st].in2},${totalAttempts}\r\n`;
        });
        downloadFile(csv, `Canasto_Saque_${Date.now()}.csv`);
      }
    }

    function downloadFile(content, filename) {
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function resetCurrentView() {
      if (!confirm("¿Seguro que querés reiniciar los contadores de esta vista?")) return;
      const isPointsActive = document.getElementById('view-puntos').classList.contains('active');
      if (isPointsActive) {
        pointsLog = [];
        document.getElementById('logStatusPuntos').innerText = "Puntos anotados: 0";
      } else {
        students.forEach(st => {
          servesData[st] = { in1: 0, in2: 0 };
        });
        initApp();
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
